<body class="bg-light-background text-light-on-background dark:bg-dark-background dark:text-dark-on-background font-body antialiased">
  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <!-- Touchscreen POS Top Bar -->
    <header class="sticky top-0 z-20 bg-light-surface border-b border-light-outline-variant px-section py-component flex flex-wrap items-center justify-between gap-standard">
      <div class="flex flex-wrap items-center gap-compact">
        <a href="../pos-overview/RestaurantOverview.html" class="min-h-[40px] inline-flex items-center gap-micro px-component rounded border border-light-outline text-label-md whitespace-nowrap"><span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_back</span><span>Overview</span></a>
        <span class="font-title text-title-md">Royal Fine Dine · POS-01</span>
        <select aria-label="Order channel" class="h-10 rounded border border-light-outline px-component text-label-md bg-light-surface-container-low">
          <option>Dine-in · Table T-01 (#SES-8812)</option>
          <option>Takeaway · Counter</option>
          <option>Delivery</option>
          <option>Room Service (Verified Hotel Stay Required)</option>
        </select>
      </div>
      <div class="flex items-center gap-compact">
        <span class="px-compact py-micro rounded bg-light-success-container text-light-on-success-container text-label-sm">Shift #SH-412</span>
        <a href="../pos-floor/RestaurantFloor.html" class="min-h-[40px] inline-flex items-center px-standard rounded border border-light-outline text-label-md whitespace-nowrap">Switch table</a>
      </div>
    </header>

    <!-- 3-Part Touchscreen POS Workspace -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-standard p-standard max-w-[1600px] w-full mx-auto">
      <!-- Left: Categories (Large Touch Targets) -->
      <nav aria-label="Menu Categories" class="lg:col-span-2 bg-light-surface border border-light-outline-variant rounded-xl p-compact flex lg:flex-col gap-micro overflow-x-auto text-label-md">
        <button type="button" class="min-h-[44px] px-standard rounded-lg bg-light-primary-container text-light-on-primary-container text-left font-medium whitespace-nowrap">All Items (64)</button>
        <button type="button" class="min-h-[44px] px-standard rounded-lg hover:bg-light-surface-container text-left whitespace-nowrap">Starters</button>
        <button type="button" class="min-h-[44px] px-standard rounded-lg hover:bg-light-surface-container text-left whitespace-nowrap">Main Course</button>
        <button type="button" class="min-h-[44px] px-standard rounded-lg hover:bg-light-surface-container text-left whitespace-nowrap">Indian Breads</button>
        <button type="button" class="min-h-[44px] px-standard rounded-lg hover:bg-light-surface-container text-left whitespace-nowrap">Rice &amp; Biryani</button>
        <button type="button" class="min-h-[44px] px-standard rounded-lg hover:bg-light-surface-container text-left whitespace-nowrap">Beverages</button>
        <button type="button" class="min-h-[44px] px-standard rounded-lg hover:bg-light-surface-container text-left whitespace-nowrap">Desserts</button>
      </nav>

      <!-- Centre: Food Catalogue -->
      <section class="lg:col-span-6 flex flex-col gap-standard">
        <input type="search" placeholder="Search dish name, SKU, or dietary tag..." class="h-11 rounded-lg border border-light-outline px-standard bg-light-surface text-body-md" aria-label="Search dish name, SKU, or dietary tag">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-standard text-body-sm">
          <button type="button" class="min-h-[108px] bg-light-surface border border-light-outline-variant hover:border-light-primary rounded-xl p-standard text-left flex flex-col justify-between">
            <div class="flex items-start justify-between gap-compact"><span class="font-medium text-title-md">Dal Makhani Signature</span><span class="px-micro rounded bg-light-success-container text-light-on-success-container text-label-sm">Veg</span></div>
            <div class="flex items-center justify-between pt-compact"><span class="text-label-sm text-light-muted">15 mins · Main Kitchen</span><span class="font-mono font-semibold text-title-md">₹590</span></div>
          </button>

          <button type="button" class="min-h-[108px] bg-light-surface border border-light-outline-variant hover:border-light-primary rounded-xl p-standard text-left flex flex-col justify-between">
            <div class="flex items-start justify-between gap-compact"><span class="font-medium text-title-md">Paneer Tikka Angaara</span><span class="px-micro rounded bg-light-success-container text-light-on-success-container text-label-sm">Veg</span></div>
            <div class="flex items-center justify-between pt-compact"><span class="text-label-sm text-light-muted">12 mins · Tandoor</span><span class="font-mono font-semibold text-title-md">₹520</span></div>
          </button>

          <button type="button" class="min-h-[108px] bg-light-surface border border-light-outline-variant hover:border-light-primary rounded-xl p-standard text-left flex flex-col justify-between">
            <div class="flex items-start justify-between gap-compact"><span class="font-medium text-title-md">Butter Garlic Naan</span><span class="px-micro rounded bg-light-success-container text-light-on-success-container text-label-sm">Veg</span></div>
            <div class="flex items-center justify-between pt-compact"><span class="text-label-sm text-light-muted">6 mins · Tandoor</span><span class="font-mono font-semibold text-title-md">₹140</span></div>
          </button>

          <button type="button" disabled class="min-h-[108px] bg-light-surface-container border border-light-outline-variant rounded-xl p-standard text-left flex flex-col justify-between cursor-not-allowed">
            <div class="flex items-start justify-between gap-compact"><span class="font-medium text-title-md text-light-on-surface-variant">Truffle Mushroom Risotto</span><span class="px-micro rounded bg-light-error-container text-light-on-error-container text-label-sm">Unavailable</span></div>
            <div class="flex items-center justify-between pt-compact"><span class="text-label-sm text-light-muted">Out of stock</span><span class="font-mono text-title-md text-light-muted">₹780</span></div>
          </button>
        </div>
      </section>

      <!-- Right: Order Cart & Billing Summary -->
      <aside class="lg:col-span-4 bg-light-surface border border-light-outline-variant rounded-xl p-section flex flex-col justify-between gap-standard text-body-sm">
        <div class="flex flex-col gap-standard">
          <div class="flex items-center justify-between border-b border-light-outline-variant pb-compact">
            <div><h1 class="text-title-lg">Current Order Cart</h1><p class="text-label-sm text-light-muted">Table T-01 · Waiter: Kabir M.</p></div>
            <span class="font-mono text-label-md">#NEW-KOT</span>
          </div>
          <div class="divide-y divide-light-outline-variant">
            <div class="py-compact flex items-center justify-between gap-compact">
              <div><p class="font-medium">2× Dal Makhani Signature</p><p class="text-label-sm text-light-muted">Note: Less spicy</p></div>
              <span class="font-mono font-medium">₹1,180</span>
            </div>
            <div class="py-compact flex items-center justify-between gap-compact">
              <div><p class="font-medium">4× Butter Garlic Naan</p><p class="text-label-sm text-light-muted">Extra butter</p></div>
              <span class="font-mono font-medium">₹560</span>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-standard pt-standard border-t border-light-outline-variant">
          <div class="flex justify-between"><span class="text-light-muted">Subtotal</span><span class="font-mono">₹1,740</span></div>
          <div class="flex justify-between"><span class="text-light-muted">GST (5%)</span><span class="font-mono">₹87</span></div>
          <div class="flex justify-between font-medium text-title-lg"><span>Cart Total</span><span class="font-mono">₹1,827</span></div>
          <div class="grid grid-cols-2 gap-compact">
            <a href="../pos-orders/LiveOrdersKOT.html" class="min-h-[44px] inline-flex items-center justify-center rounded-lg bg-light-primary text-light-on-primary text-label-md whitespace-nowrap">Send to Kitchen</a>
            <a href="../pos-billing/BillingAndSplitPayments.html" class="min-h-[44px] inline-flex items-center justify-center rounded-lg border border-light-outline text-label-md whitespace-nowrap">Create Bill</a>
          </div>
        </div>
      </aside>
    </main>
  </div>
