openapi: 3.1.0
info:
  title: HospitalityOS API — Contract Baseline
  version: 0.1.0
  description: >-
    Starter contract for engineering alignment, not a complete generated API specification.
    Before implementation release, add every panel operation, full request/response schemas,
    state transitions, authorization scopes, pagination/filter parameters, and verified webhook
    provider contracts. API authorization must be enforced server-side.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder only; replace with an owner-approved environment URL.
security:
  - sessionCookie: []
tags:
  - name: Identity
  - name: Tenants
  - name: Properties
  - name: Hotel
  - name: Restaurant
  - name: QR
  - name: Inventory
  - name: Finance
  - name: CRM
  - name: Payments
  - name: BI
paths:
  /auth/login:
    post:
      tags: [Identity]
      security: []
      summary: Authenticate an account
      description: Apply rate limits and generic error messages; tenant membership is resolved server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, minLength: 1, writeOnly: true }
      responses:
        '200':
          description: Authenticated or MFA challenge required.
          headers:
            Set-Cookie: { schema: { type: string }, description: Secure session cookie; never expose session token to JS. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me:
    get:
      tags: [Identity]
      summary: Get current principal and permitted workspace memberships
      responses:
        '200':
          description: Principal profile; never returns password hashes or secret claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentPrincipal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /platform/tenants:
    get:
      tags: [Tenants]
      summary: Search tenant directory
      description: Requires platform tenant-read permission; filters are server-side.
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Page of permitted tenant summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedTenantSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tenants]
      summary: Start tenant provisioning
      description: Requires platform tenant-create permission and idempotency. Provisioning may be asynchronous.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantProvisionRequest' }
      responses:
        '202':
          description: Provisioning accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenant/properties:
    get:
      tags: [Properties]
      summary: List properties in the authenticated tenant and user scope
      responses:
        '200':
          description: Scoped property list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Properties]
      summary: Create property
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyCreate' }
      responses:
        '201': { description: Created property, content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /properties/{propertyId}/availability:
    get:
      tags: [Hotel]
      summary: Quote room availability
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - in: query
          name: arrivalDate
          required: true
          schema: { type: string, format: date }
        - in: query
          name: departureDate
          required: true
          schema: { type: string, format: date }
        - in: query
          name: adults
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: children
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Availability quote with expiry and price snapshot. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /properties/{propertyId}/reservations:
    post:
      tags: [Hotel]
      summary: Create a reservation hold or confirmed reservation according to payment policy
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
      responses:
        '201': { description: Reservation or bounded hold created. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /outlets/{outletId}/orders:
    post:
      tags: [Restaurant]
      summary: Place a restaurant order
      parameters:
        - $ref: '#/components/parameters/OutletId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201': { description: Accepted or placed order with authoritative price snapshot. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /table-sessions/{sessionId}/orders:
    post:
      tags: [Restaurant]
      summary: Add a participant order to an active table session
      description: Guest principal can create/read only own participant order; staff sees session aggregate only with permission.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201': { description: Participant-owned order created. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /qr/destinations:
    post:
      tags: [QR]
      summary: Create a QR destination and one-time token asset
      description: Requires QR management permission, feature entitlement and quota. Raw token is returned once and must not be logged or persisted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QrDestinationCreate' }
      responses:
        '201': { description: Destination and one-time QR URL/asset metadata. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /public/qr/{opaqueToken}:
    get:
      tags: [QR]
      security: []
      summary: Resolve a public QR destination safely
      description: Public, rate-limited, returns safe destination context only; room QR must not disclose guest or folio data.
      parameters:
        - in: path
          name: opaqueToken
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        '200': { description: Safe QR destination context. }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/qr/{opaqueToken}/guest-session:
    post:
      tags: [QR]
      security: []
      summary: Establish scoped customer/guest service session
      description: QR token alone is not room guest authentication. Rate limited and bound to destination purpose.
      parameters:
        - in: path
          name: opaqueToken
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestSessionRequest' }
      responses:
        '201': { description: Short-lived scoped guest capability/session. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /inventory/movements/adjustments:
    post:
      tags: [Inventory]
      summary: Submit stock adjustment for approval/posting
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockAdjustment' }
      responses:
        '202': { description: Adjustment submitted or accepted according to approval policy. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /finance/journal-entries:
    post:
      tags: [Finance]
      summary: Create draft journal entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalDraft' }
      responses:
        '201': { description: Draft journal with validation summary. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /payments/webhooks/{providerCode}:
    post:
      tags: [Payments]
      security: []
      summary: Receive provider webhook
      description: Verify provider-specific signature, merchant/account, event age, amount/currency and replay/idempotency before state transition.
      parameters:
        - in: path
          name: providerCode
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Verified event accepted or safely acknowledged as duplicate. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bi/dashboards/{dashboardCode}:
    get:
      tags: [BI]
      summary: Retrieve an authorised dashboard read model
      parameters:
        - in: path
          name: dashboardCode
          required: true
          schema: { type: string }
        - in: query
          name: propertyId
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Dashboard data with metric definition, scope and freshness metadata. }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-hospitality_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OutletId:
      name: outletId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Authentication or valid guest capability required.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Action not authorised. Does not reveal inaccessible resource details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource not found or not visible to caller.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: State/version/idempotency conflict.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationError:
      description: Input validation failed.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    RateLimited:
      description: Rate limit exceeded.
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        requestId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    AuthResult:
      type: object
      properties:
        status: { type: string, enum: [authenticated, mfa_required, verification_required] }
        nextStep: { type: string }
        memberships:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              workspaceCodes: { type: array, items: { type: string } }
    CurrentPrincipal:
      type: object
      properties:
        principalId: { type: string, format: uuid }
        principalType: { type: string, enum: [platform_user, employee, customer, guest_capability] }
        displayName: { type: string }
        memberships: { type: array, items: { type: object, additionalProperties: true } }
    TenantProvisionRequest:
      type: object
      required: [displayName, slug, businessCapabilities, ownerEmail, planVersionId]
      properties:
        displayName: { type: string, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9-]{3,60}$' }
        businessCapabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [hotel, restaurant] }
        ownerEmail: { type: string, format: email }
        planVersionId: { type: string, format: uuid }
        initialProperties: { type: array, items: { type: object, additionalProperties: true } }
    OperationAccepted:
      type: object
      required: [operationId, status]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [queued, provisioning, completed, failed] }
    PagedTenantSummary:
      type: object
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        nextCursor: { type: [string, 'null'] }
    PropertyCreate:
      type: object
      required: [name, propertyType, timezone, currency]
      properties:
        name: { type: string }
        propertyType: { type: string, enum: [hotel, restaurant, mixed, other] }
        timezone: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        address: { type: object, additionalProperties: true }
    Property:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        propertyType: { type: string }
        status: { type: string }
    PropertyList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Property' } }
    ReservationCreate:
      type: object
      required: [arrivalDate, departureDate, occupancy, ratePlanId, guest]
      properties:
        arrivalDate: { type: string, format: date }
        departureDate: { type: string, format: date }
        occupancy: { type: object, required: [adults], properties: { adults: { type: integer, minimum: 1 }, children: { type: integer, minimum: 0 } } }
        ratePlanId: { type: string, format: uuid }
        guest: { type: object, additionalProperties: true }
        quoteReference: { type: string }
    OrderCreate:
      type: object
      required: [channel, lines]
      properties:
        channel: { type: string, enum: [dine_in_qr, dine_in_staff, takeaway, delivery, room_service] }
        tableSessionReference: { type: string }
        guestCapability: { type: string, writeOnly: true }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [menuItemId, quantity]
            properties:
              menuItemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              modifierSelections: { type: array, items: { type: object, additionalProperties: true } }
              notes: { type: string, maxLength: 500 }
    QrDestinationCreate:
      type: object
      required: [targetType, targetResourceId]
      properties:
        targetType: { type: string, enum: [table, room, poolside, banquet, service_point] }
        targetResourceId: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        outletId: { type: [string, 'null'], format: uuid }
        label: { type: string, maxLength: 120 }
    GuestSessionRequest:
      type: object
      description: Purpose-specific verification payload. Never accept room charge solely from a scanned QR token.
      properties:
        verificationMethod: { type: string, enum: [signed_guest_session, verified_contact_otp, stay_pin, other_approved] }
        verificationProof: { type: string, writeOnly: true }
    StockAdjustment:
      type: object
      required: [locationId, itemId, quantityDelta, unitCode, reason]
      properties:
        locationId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        quantityDelta: { type: number }
        unitCode: { type: string }
        reason: { type: string, minLength: 5 }
        evidenceReference: { type: string }
    JournalDraft:
      type: object
      required: [legalEntityId, accountingDate, currency, lines]
      properties:
        legalEntityId: { type: string, format: uuid }
        accountingDate: { type: string, format: date }
        currency: { type: string, minLength: 3, maxLength: 3 }
        description: { type: string }
        lines:
          type: array
          minItems: 2
          items:
            type: object
            required: [accountId]
            properties:
              accountId: { type: string, format: uuid }
              debitMinor: { type: integer, minimum: 0 }
              creditMinor: { type: integer, minimum: 0 }
              costCentreId: { type: [string, 'null'], format: uuid }
